<ng-template #items><ng-content /></ng-template>
@if (trigger()) {
<andes-float-button
  class="andes-float-button-group__trigger"
  [aria-label]="ariaLabel()"
  [aria-expanded]="open()"
  [aria-controls]="menuId"
  (click)="onTriggerClick()"
  (keydown)="onTriggerKeydown()"
>
  @if (closeIcon() || triggerIcon()) { @if (open()) { @if (closeIcon(); as
  closeTemplate) {
  <span class="andes-float-button-group__swap"
    ><ng-container *ngTemplateOutlet="closeTemplate"
  /></span>
  } @else {
  <span class="andes-float-button-group__swap">
    <ng-icon
      class="andes-float-button-group__icon"
      name="lucideX"
      aria-hidden="true"
    />
  </span>
  } } @else { @if (triggerIcon(); as openTemplate) {
  <span class="andes-float-button-group__swap"
    ><ng-container *ngTemplateOutlet="openTemplate"
  /></span>
  } @else {
  <span class="andes-float-button-group__swap">
    <ng-icon
      class="andes-float-button-group__icon"
      name="lucidePlus"
      aria-hidden="true"
    />
  </span>
  } } } @else {
  <ng-icon
    class="andes-float-button-group__icon andes-float-button-group__glyph"
    [class.andes-float-button-group__glyph--open]="open()"
    name="lucidePlus"
    aria-hidden="true"
  />
  }
</andes-float-button>
<div
  class="andes-float-button-group__menu"
  data-slot="float-button-group-menu"
  [id]="menuId"
  [class.andes-float-button-group__menu--open]="open()"
  [attr.data-state]="open() ? 'open' : 'closed'"
  [attr.inert]="open() ? null : ''"
>
  <ng-container *ngTemplateOutlet="items" />
</div>
} @else {
<ng-container *ngTemplateOutlet="items" />
}
