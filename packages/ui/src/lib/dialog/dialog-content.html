<!-- The projected body is wrapped so it, and not the surface, is the scrolling box:
     the close control below is positioned against the surface, so scrolling the surface
     itself carried the control off the top of the dialog along with the content. -->
<div class="andes-dialog__viewport">
  <ng-content />

  @if (root.loading()) {
  <!-- Stands in for the body while it loads. The header stays (it labels the dialog),
       everything else the consumer projected is hidden by the stylesheet. -->
  <div
    class="andes-dialog__skeleton"
    data-slot="dialog-skeleton"
    aria-hidden="true"
  >
    <span class="andes-dialog__skeleton-line"></span>
    <span class="andes-dialog__skeleton-line"></span>
    <span class="andes-dialog__skeleton-line"></span>
    <span class="andes-dialog__skeleton-line"></span>
  </div>
  } @else if (root.footer(); as footer) {
  <andes-dialog-actions
    [template]="footer === 'default' ? null : footer"
    [context]="root.footerContext"
    [okText]="root.okText()"
    [cancelText]="root.cancelText()"
    [okType]="root.okType()"
    [okDisabled]="root.okDisabled()"
    [cancelDisabled]="root.cancelDisabled()"
    [okLoading]="root.confirmLoading()"
    [cancelLoading]="root.cancelLoading()"
    [showCancel]="root.showCancel()"
    [autoFocusButton]="root.autoFocusButton()"
    [okButtonProps]="root.okButtonProps()"
    [cancelButtonProps]="root.cancelButtonProps()"
    (okClick)="root.requestOk()"
    (cancelClick)="root.requestCancel()"
  />
  }
</div>

@if (root.maximizable()) {
<!-- Sits beside the "x", after the content for the same focus-order reason. `aria-pressed`
     rather than a swapped label alone, so the state is announced as well as the action. -->
<button
  type="button"
  class="andes-dialog__maximize"
  data-slot="dialog-maximize-button"
  [attr.aria-label]="root.fullscreen() ? restoreLabel() : maximizeLabel()"
  [attr.aria-pressed]="root.fullscreen()"
  (click)="root.toggleFullscreen()"
>
  <ng-icon
    class="andes-dialog__close-icon"
    [name]="root.fullscreen() ? 'lucideMinimize' : 'lucideMaximize'"
  />
</button>
}

<!-- The close control follows the maximize one, so the pair tabs left to right. -->
@if (showCloseButton()) {
<!-- Rendered after the projected content so the focus trap lands on the dialog's own
     first control rather than on the dismiss affordance. A modal should
     carry an in-surface close control at all: Escape and outside-click are unreachable
     for touch screen-reader users. -->
<button
  type="button"
  class="andes-dialog__close"
  data-slot="dialog-close-button"
  [attr.aria-label]="closeLabel()"
  [disabled]="closeDisabled()"
  (click)="root.requestCancel()"
>
  @if (closeIcon(); as icon) {
  <ng-container *ngTemplateOutlet="icon" />
  } @else {
  <ng-icon class="andes-dialog__close-icon" name="lucideX" />
  }
</button>
}
