@if (showPlayControl()) {
<!-- First in the document, as the pattern asks: the control that stops the movement comes
       before the thing that moves. -->
<button
  type="button"
  class="andes-carousel__control"
  data-slot="carousel-pause"
  [attr.aria-label]="autoplayWanted() ? resolvedLabels().pause : resolvedLabels().play"
  (click)="togglePlay()"
>
  @if (autoplayWanted()) {
  <ng-icon name="lucidePause" aria-hidden="true" />
  } @else {
  <ng-icon name="lucidePlay" aria-hidden="true" />
  }
</button>
} @if (arrowMode()) {
<button
  type="button"
  class="andes-carousel__arrow andes-carousel__arrow--previous"
  data-slot="carousel-previous"
  [attr.data-outside]="arrowPlacement() === 'outside' ? '' : null"
  [attr.data-vertical]="isVertical() ? '' : null"
  [attr.aria-label]="resolvedLabels().previous"
  [attr.aria-disabled]="canScrollPrev() ? null : 'true'"
  (click)="userPrev()"
>
  @if (arrowTemplate(); as template) {
  <ng-container
    [ngTemplateOutlet]="template"
    [ngTemplateOutletContext]="prevContext()"
  />
  } @else {
  <ng-icon
    class="andes-carousel__chevron"
    name="lucideChevronLeft"
    aria-hidden="true"
  />
  }
</button>
<button
  type="button"
  class="andes-carousel__arrow andes-carousel__arrow--next"
  data-slot="carousel-next"
  [attr.data-outside]="arrowPlacement() === 'outside' ? '' : null"
  [attr.data-vertical]="isVertical() ? '' : null"
  [attr.aria-label]="resolvedLabels().next"
  [attr.aria-disabled]="canScrollNext() ? null : 'true'"
  (click)="userNext()"
>
  @if (arrowTemplate(); as template) {
  <ng-container
    [ngTemplateOutlet]="template"
    [ngTemplateOutletContext]="nextContext()"
  />
  } @else {
  <ng-icon
    class="andes-carousel__chevron"
    name="lucideChevronRight"
    aria-hidden="true"
  />
  }
</button>
}

<!-- The live region: silent while the carousel rotates by itself, polite otherwise, so a
     user stepping through slides hears them and an autoplaying one does not talk over
     everything else. -->
<div
  #viewport
  class="andes-carousel__viewport"
  data-slot="carousel-viewport"
  role="group"
  tabindex="0"
  aria-atomic="false"
  [attr.aria-label]="resolvedLabels().slides"
  [attr.aria-live]="liveMode()"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerEnd($event)"
  (pointercancel)="onPointerEnd($event)"
  (dragstart)="onDragStart($event)"
>
  <ng-content />
</div>

@if (dotsPlacement(); as placement) {
<div
  class="andes-carousel__dots"
  data-slot="carousel-dots"
  role="group"
  [class]="dotsClass()"
  [attr.data-position]="placement"
  [attr.data-style]="dotStyle()"
  [attr.data-outside]="dotPosition() === 'outside' ? '' : null"
  [attr.aria-label]="resolvedLabels().dots"
>
  @for (dot of dotItems(); track dot.index) {
  <button
    type="button"
    class="andes-carousel__dot"
    data-slot="carousel-dot"
    [class.andes-carousel__dot--active]="dot.active"
    [class.andes-carousel__dot--progress]="progressOn() && dot.active"
    [class.andes-carousel__dot--progress-alt]="progressAlt()"
    [class.andes-carousel__dot--progress-held]="!isPlaying()"
    [attr.aria-label]="resolvedLabels().goTo(dot.index + 1, dot.count)"
    [attr.aria-current]="dot.active ? 'true' : null"
    [style.--andes-carousel-progress-duration]="progressDuration()"
    (click)="dot.goTo()"
  >
    @if (dotTemplate(); as template) {
    <ng-container
      [ngTemplateOutlet]="template"
      [ngTemplateOutletContext]="dot"
    />
    } @else {
    <span
      class="andes-carousel__marker"
      aria-hidden="true"
      [class.andes-carousel__marker--rail]="placement === 'start' || placement === 'end'"
    ></span>
    }
  </button>
  }
</div>
}
