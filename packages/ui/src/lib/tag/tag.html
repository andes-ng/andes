<!--
  The icon/label projection markers live here ONCE, not once per branch below: Angular
  resolves an `<ng-content>` selector to a single content bucket per component template,
  and a bucket is only ever handed to whichever `<ng-content>` instance for that selector
  is the first one Angular's renderer walks past when it actually attaches the component's
  view - with four structurally-identical copies (one per `@if`/`@else if` branch), only
  that one copy renders the projected nodes and the other three silently render nothing,
  even though they're never simultaneously in the DOM. Routing every branch through this
  one shared template via `ngTemplateOutlet` means there is exactly one `<ng-content>` per
  selector in the whole component, so the ambiguity can't arise.
-->
<ng-template #content>
  @if (avatar(); as src) {
  <img class="andes-tag__avatar" [src]="src" alt="" />
  }
  <!-- Empty (and hidden by tag.css) unless `icon` or a slot=icon element fills it. -->
  <span [class]="iconClasses()" [style]="iconStyle()"
    >@if (icon(); as iconTemplate) {<ng-container
      [ngTemplateOutlet]="iconTemplate" />}<ng-content select="[slot=icon]"
  /></span>
  <span [class]="contentClasses()" [style]="contentStyle()"
    ><ng-content
  /></span>
</ng-template>

@if (dismissed()) {
<!-- hideOnClose: closed and not vetoed - render nothing. -->
} @else if (isClosable()) {
<!-- Only this branch can dismiss itself, so only it carries the leave animation. -->
<span
  #closableTag
  data-slot="tag"
  [class]="classes()"
  [style.--andes-tag-color]="customColor()"
  [style]="rootStyle()"
  animate.leave="andes-tag-leave"
>
  <ng-container [ngTemplateOutlet]="content" />
  <button
    type="button"
    class="andes-tag__close"
    [disabled]="disabled()"
    [attr.aria-label]="closeLabel()"
    (click)="onClose($event)"
  >
    @if (closeTemplate(); as icon) {
    <ng-container [ngTemplateOutlet]="icon" />
    } @else {
    <ng-icon name="lucideX" />
    }
  </button>
</span>
} @else if (isLink()) {
<a
  data-slot="tag"
  [class]="classes()"
  [style.--andes-tag-color]="customColor()"
  [style]="rootStyle()"
  [attr.href]="disabled() ? null : href()"
  [attr.target]="target()"
  [attr.aria-disabled]="disabled() ? 'true' : null"
  (click)="onTagClick($event)"
>
  <ng-container [ngTemplateOutlet]="content" />
</a>
} @else if (isInteractive()) {
<button
  type="button"
  data-slot="tag"
  [class]="classes()"
  [style.--andes-tag-color]="customColor()"
  [style]="rootStyle()"
  [disabled]="disabled()"
  [attr.aria-pressed]="checkable() ? isChecked() : null"
  (click)="onTagClick($event)"
>
  <ng-container [ngTemplateOutlet]="content" />
</button>
} @else {
<span
  data-slot="tag"
  [class]="classes()"
  [style.--andes-tag-color]="customColor()"
  [style]="rootStyle()"
>
  <ng-container [ngTemplateOutlet]="content" />
</span>
}
