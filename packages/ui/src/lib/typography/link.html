<andes-text
  [type]="type()"
  [size]="size()"
  [disabled]="disabled()"
  [ellipsis]="ellipsis()"
  [(expanded)]="expanded"
  [copyable]="copyable()"
  (copied)="copied.emit($event)"
  (truncated)="truncated.emit($event)"
>
  <a
    class="andes-link"
    [attr.href]="disabled() ? null : href()"
    [attr.target]="resolvedTarget()"
    [attr.rel]="resolvedRel()"
    [attr.download]="resolvedDownload()"
    [attr.role]="disabled() ? 'link' : null"
    [attr.aria-disabled]="disabled() || null"
    (click)="onClick($event)"
    ><ng-content />@if (external()) {<ng-icon
      class="andes-link__external"
      name="lucideArrowUpRight"
      [attr.aria-label]="externalLabel()"
    />
    }</a
  >
</andes-text>
