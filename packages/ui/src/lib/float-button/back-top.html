<andes-float-button
  class="andes-back-top__button"
  [type]="type()"
  [shape]="shape()"
  [size]="size()"
  [fixed]="fixed()"
  [right]="right()"
  [bottom]="bottom()"
  [left]="left()"
  [top]="top()"
  [tooltip]="tooltip()"
  [aria-label]="ariaLabel()"
  [attr.inert]="visible() ? null : ''"
  [attr.aria-hidden]="visible() ? null : 'true'"
  (click)="onClick($event)"
>
  <ng-content>
    <ng-icon
      class="andes-back-top__icon"
      name="lucideArrowUp"
      aria-hidden="true"
    />
  </ng-content>
</andes-float-button>
